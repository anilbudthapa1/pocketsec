[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketsec"
version = "0.1.0"
description = "PocketSec — ultra-lightweight Linux security-event intelligence hub (Stage 0 research foundation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# ADR-0002: the endpoint runtime has ZERO third-party runtime dependencies.
# The 2 GB host target and the reproducibility policy both depend on this.
dependencies = []

[project.optional-dependencies]
# numpy is a DEV dependency only: it is permitted inside stage*/research/
# (ADR-0008) and the test suite exercises that code, so the `test` CI job needs
# it. The `gate` job installs the package bare, which is why every gate is
# stdlib-only.
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "numpy>=1.26"]

[project.scripts]
pocketsec-stage0 = "pocketsec.stage0.cli:main"
pocketsec-stage1 = "pocketsec.stage1.cli:main"
pocketsec-stage2 = "pocketsec.stage2.cli:main"
pocketsec-stage3 = "pocketsec.stage3.cli:main"
pocketsec-stage4 = "pocketsec.stage4.cli:main"
pocketsec-stage5 = "pocketsec.stage5.cli:main"
pocketsec-stage6 = "pocketsec.stage6.cli:main"
pocketsec-stage7 = "pocketsec.stage7.cli:main"
pocketsec-stage9 = "pocketsec.stage9.cli:main"

[tool.setuptools.packages.find]
include = ["pocketsec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: benchmark-style tests that sample real process resources"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pocketsec", "tests"]
